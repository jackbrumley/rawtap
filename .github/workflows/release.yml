# Builds every release asset on GitHub and attaches it to a pre-release.
#
#   Tag push (vX.Y.Z): creates the pre-release (notes skeleton from
#     release-notes-template.mjs), builds Linux and Windows in parallel,
#     uploads each platform's assets, verifies the release is complete, then
#     install-tests it with the installer scripts from the tag.
#     Promotion to latest stays a deliberate step: npm run release:promote.
#   Manual run (Actions tab or `gh workflow run release.yml --ref <branch>`):
#     a dry run that builds and packages all platforms and keeps the files as
#     workflow artifacts, without touching any release.
#
# Asset names come only from scripts/release-assets.mjs via package-release.mjs.
# See docs/RELEASE.md and the Release and Update Standard.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Read release version
        id: version
        run: |
          tag="v$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${tag}"

      - name: Check tag matches the configured version
        if: env.PUBLISH == 'true'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.tag }}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the Cargo.toml version ${{ steps.version.outputs.tag }}. Use npm run release:prepare."
            exit 1
          fi

      - name: Create pre-release
        if: env.PUBLISH == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; reusing it."
          else
            npm run --silent release:notes > release-notes.md
            gh release create "$tag" --verify-tag --prerelease --title "$tag" --notes-file release-notes.md
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Linux builds inside the pinned Ubuntu 22.04 container (glibc floor),
      # exactly as a local `npm run release:linux` does.
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run release:linux

      # Installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'

      # NSIS for setup.exe, WiX 5 for the MSI (scripts/build-windows-release.mjs).
      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Windows installers
        if: runner.os == 'Windows'
        shell: bash
        run: npm run release:windows

      - name: Package release assets
        shell: bash
        run: node scripts/package-release.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/*
          retention-days: 14

      - name: Upload to release
        if: env.PUBLISH == 'true'
        shell: bash
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release-artifacts/* --clobber

  verify:
    name: Verify release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/verify-release.mjs

  # Installs the published pre-release with the installer scripts from this
  # tag (the ones promotion deploys to brumley.info/rawtap), exactly as users
  # will, and checks each install runs.
  install-test:
    name: Install test ${{ matrix.name }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2022
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      # Shared runner IPs exhaust GitHub's anonymous API rate limit.
      RAWTAP_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install .deb (system package)
        if: runner.os == 'Linux'
        run: |
          bash docs/install.sh --version "$TAG" --yes --no-relaunch
          /usr/bin/rawtap --version | grep -F "${TAG#v}"
          test -f /usr/share/applications/info.brumley.rawtap.desktop
          getent group dialout | cut -d: -f4 | tr ',' '\n' | grep -qx "$(id -un)"

      # Replaces the .deb install with the user-local AppImage.
      - name: Install AppImage (user-local)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          bash docs/install.sh --version "$TAG" --yes --no-relaunch --appimage
          "$HOME/.local/bin/rawtap" --version | grep -F "${TAG#v}"
          test -f "$HOME/.local/share/applications/info.brumley.rawtap.desktop"

      - name: Uninstall (Linux)
        if: runner.os == 'Linux'
        run: |
          bash docs/uninstall.sh --yes
          test ! -e /usr/bin/rawtap
          test ! -e "$HOME/.local/bin/rawtap"
          test ! -e "$HOME/.local/share/applications/info.brumley.rawtap.desktop"

      - name: Install MSI (system-wide)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./docs/install.ps1 -Version $env:TAG -System -NoRelaunch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Join-Path $env:ProgramFiles "rawtap\rawtap.exe"
          $version = & $exe --version
          Write-Host "Installed: $exe ($version)"
          if ($version -notmatch [regex]::Escape($env:TAG.TrimStart('v'))) { exit 1 }
          # The MSI writes the folder with a trailing backslash.
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine") -split ";" | ForEach-Object { $_.TrimEnd("\") }
          if ($machinePath -notcontains (Join-Path $env:ProgramFiles "rawtap")) { Write-Error "rawtap is not on the system PATH"; exit 1 }

      # Removes the MSI install first (install.ps1 never leaves both).
      - name: Install setup.exe (user)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./docs/install.ps1 -Version $env:TAG -NoRelaunch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dir = Join-Path $env:LOCALAPPDATA "rawtap"
          $version = & (Join-Path $dir "rawtap.exe") --version
          Write-Host "Installed: $dir ($version)"
          if ($version -notmatch [regex]::Escape($env:TAG.TrimStart('v'))) { exit 1 }
          if (Test-Path (Join-Path $env:ProgramFiles "rawtap\rawtap.exe")) { Write-Error "the MSI install is still there"; exit 1 }
          $userPath = (Get-Item "HKCU:\Environment").GetValue("Path", "", "DoNotExpandEnvironmentNames")
          if (($userPath -split ";") -notcontains $dir) { Write-Error "rawtap is not on the user PATH"; exit 1 }

      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./docs/uninstall.ps1
          $dir = Join-Path $env:LOCALAPPDATA "rawtap"
          if (Test-Path (Join-Path $dir "rawtap.exe")) { Write-Error "rawtap.exe is still installed"; exit 1 }
          $userPath = (Get-Item "HKCU:\Environment").GetValue("Path", "", "DoNotExpandEnvironmentNames")
          if (($userPath -split ";") -contains $dir) { Write-Error "rawtap is still on the user PATH"; exit 1 }
