# Checks every push to dev/main and every pull request (App Standard
# section 7): the pre-submit checklist from AGENTS.md on each platform RawTap
# ships (Linux and Windows). RawTap is a terminal app with no frontend, so
# there is no typecheck, lint or frontend build. Release builds are made only
# by release.yml.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Installs the version (and components) pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # serialport lists USB serial ports through libudev.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - run: npm run check:structure

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
