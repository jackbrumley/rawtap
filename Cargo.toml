[package]
name = "rawtap"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "See and send raw serial and TCP data, in hex and text. A console when you need one."
repository = "https://github.com/jackbrumley/rawtap"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
vt100 = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
