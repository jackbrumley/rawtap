[package]
name = "rawtap"
version = "0.9.2"
edition = "2024"
license = "AGPL-3.0-only"
description = "See and send raw serial and TCP data, in hex and text. A console when you need one."
repository = "https://github.com/jackbrumley/rawtap"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
log = "0.4"
portable-pty = "0.9.0"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
ureq = { version = "3", features = ["json"] }
vt100 = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
